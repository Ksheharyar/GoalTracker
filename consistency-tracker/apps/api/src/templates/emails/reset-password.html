<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your GoalTracker password</title>
</head>
<body style="margin:0;padding:0;background:#0b1020;font-family:Arial,Helvetica,sans-serif;color:#e5e7eb;">
  <div style="max-width:640px;margin:0 auto;padding:32px 20px;">
    <div style="background:#0f172a;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:32px;box-shadow:0 12px 40px rgba(0,0,0,0.25);">
      <h2 style="margin:0 0 16px;font-size:28px;line-height:1.2;color:#ffffff;">Reset your GoalTracker password</h2>

      <p style="margin:0 0 14px;font-size:16px;line-height:1.7;color:#cbd5e1;">You requested a password reset.</p>

      <p style="margin:0 0 24px;font-size:16px;line-height:1.7;color:#cbd5e1;">Click below to create a new password:</p>

      <a href="{{RESET_URL}}" style="display:inline-block;padding:12px 20px;background:#ef4444;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:600;">Reset Password</a>

      <p style="margin:24px 0 0;font-size:14px;line-height:1.7;color:#cbd5e1;">This link expires in 1 hour.</p>

      <p style="margin:16px 0 0;font-size:14px;line-height:1.7;color:#cbd5e1;">If you didn’t request this reset, ignore this email.</p>

      <br />

      <p style="margin:0;font-size:14px;line-height:1.7;color:#94a3b8;">{{FOOTER}}</p>
    </div>
  </div>
</body>
</html>
